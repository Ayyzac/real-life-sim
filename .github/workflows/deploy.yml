name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, publish a Pages artifact, sign the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; queue them instead of cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Quality gates run BEFORE the build, so broken code never reaches
      # the public URL.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Check simulation core purity
        run: npm run check:core-purity

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
